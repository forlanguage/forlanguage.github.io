name: Đóng góp câu hỏi
description: Gửi câu hỏi thực tế sau kỳ thi hoặc bộ câu hỏi mới để mở rộng ngân hàng
title: "[Question contribution] "
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã đóng góp. Câu hỏi thực tế sau kỳ thi là nguồn rất có giá trị. Hãy mô tả lại bằng cách diễn đạt của bạn và không đưa thông tin cá nhân hoặc nội dung mà bạn không có quyền chia sẻ.
  - type: dropdown
    id: exam
    attributes:
      label: Kỳ thi hoặc khu học
      options:
        - Aptis General
        - Grammar
        - Vocabulary
        - Reading
        - Technical English
        - Khác
    validations:
      required: true
  - type: input
    id: question_type
    attributes:
      label: Dạng câu hỏi
      placeholder: Ví dụ Reading Part 3, Grammar MCQ, Vocabulary matching
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Nội dung câu hỏi hoặc mô tả gần đúng
      description: Có thể gửi một câu hoặc cả bộ câu hỏi.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Các lựa chọn đáp án
      placeholder: A. ...\nB. ...\nC. ...
  - type: input
    id: proposed_answer
    attributes:
      label: Đáp án đề xuất
      placeholder: Ví dụ B
  - type: textarea
    id: explanation
    attributes:
      label: Lý do, ghi chú hoặc nguồn hỗ trợ
  - type: dropdown
    id: confidence
    attributes:
      label: Mức độ chắc chắn
      options:
        - Cao
        - Trung bình
        - Thấp
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Xác nhận
      options:
        - label: Tôi đã loại bỏ thông tin cá nhân và không đăng nội dung mà tôi không có quyền chia sẻ.
          required: true
