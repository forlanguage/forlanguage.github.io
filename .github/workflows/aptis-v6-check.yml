name: Aptis v6 checks

on:
  pull_request:
    paths:
      - aptis/**
      - docs/aptis-v6/**
      - .github/workflows/aptis-v6-check.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check aptis/app.js
          node --check aptis/runtime-v6-module.js
          node --check aptis/history-v5.js
          node --check aptis/question-id-v53.js
          node --check aptis/listening/listening-v6.js
          node --check aptis/speaking/speaking-v6.js
          node --check aptis/writing/writing-v6.js
          node --check aptis/shared/attempt-store-v6.js

      - name: Validate HTML application contract
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          required = {
              "homeView", "quizView", "resultView", "statsView", "statsBtn",
              "themeBtn", "topicSelect", "readingTestSelect", "attemptCount",
              "bestScore", "lastScore", "answeredTotal", "exitBtn", "submitBtn",
              "progressText", "timer", "progressBar", "blockHost", "prevBtn",
              "nextBtn", "resultScore", "resultPercent", "resultMessage",
              "grammarScore", "vocabScore", "readingScore", "blankScore",
              "reviewAllBtn", "reviewBtn", "retryCurrentBtn", "downloadResultBtn",
              "restartBtn", "reviewSummary", "reviewHost", "overallSummary",
              "sessionLabel", "backHomeBtn", "bankStatsGrid", "sessionStatsGrid",
              "retrySessionWrongBtn", "exportSessionBtn", "exportAllBtn",
              "clearCacheBtn", "clearAllBtn", "modeStatsBody",
              "readingCoverageText", "readingCoverageBar", "readingStatsBody",
              "historyBody",
          }

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "id" and value: self.ids.append(value)

          for filename in ["aptis/core/index.html", "aptis/reading/index.html"]:
              parser = IdParser(); parser.feed(Path(filename).read_text(encoding="utf-8"))
              ids = set(parser.ids)
              missing = sorted(required - ids)
              duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
              if missing or duplicates:
                  raise SystemExit(f"{filename}: missing={missing}, duplicate IDs={duplicates}")
              print(f"{filename}: HTML contract OK")

          for filename in [
              "aptis/index.html", "aptis/listening/index.html",
              "aptis/speaking/index.html", "aptis/writing/index.html",
              "aptis/history/index.html"
          ]:
              if not Path(filename).exists(): raise SystemExit(f"missing page: {filename}")
          PY

      - name: Validate bank and module registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("aptis/data/manifest.json").read_text(encoding="utf-8"))
          reading = json.loads(Path("aptis/data/reading-manifest.json").read_text(encoding="utf-8"))
          registry = json.loads(Path("aptis/module-registry-v6.json").read_text(encoding="utf-8"))
          listening = json.loads(Path("aptis/data/listening/demo-test.json").read_text(encoding="utf-8"))
          speaking = json.loads(Path("aptis/data/speaking/demo-test.json").read_text(encoding="utf-8"))
          writing = json.loads(Path("aptis/data/writing/demo-test.json").read_text(encoding="utf-8"))

          assert manifest["grammar_count"] == 1000
          assert manifest["vocabulary_count"] == 1000
          assert manifest["reading_count"] == 696
          assert manifest["total_item_count"] == 2696
          assert manifest["reading_test_count"] == 24
          assert reading["item_count"] == 696 and reading["test_count"] == 24

          modules = {item["id"]: item for item in registry["modules"]}
          assert modules["core"]["status"] == "available"
          assert modules["reading"]["status"] == "available"
          assert modules["listening"]["status"] == "mvp"
          assert modules["speaking"]["status"] == "mvp"
          assert modules["writing"]["status"] == "mvp"
          assert listening["test_id"] == "LT01" and listening["tasks"]
          assert speaking["test_id"] == "ST01" and len(speaking["tasks"]) == 4
          assert writing["test_id"] == "WT01" and len(writing["tasks"]) == 5
          print("Aptis v6 MVP registry and banks OK")
          PY
