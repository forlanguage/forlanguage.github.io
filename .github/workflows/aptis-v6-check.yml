name: Aptis v6 checks

on:
  pull_request:
    paths: ["aptis/**", "tools/writing/**", "docs/aptis-v6/**", ".github/workflows/aptis-v6-check.yml", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          for file in \
            aptis/app.js aptis/runtime-v6-module.js aptis/history-v5.js aptis/question-id-v53.js \
            aptis/listening/listening-v6.js aptis/listening/listening-player-v1.js aptis/listening/listening-retry-v2.js \
            aptis/speaking/speaking-v6.js aptis/writing/writing-v6.js aptis/writing/writing-recovery-v2.js aptis/writing/writing-self-review-v3.js \
            aptis/shared/attempt-store-v6.js aptis/shared/history-page-v6.js aptis/shared/history-writing-review-v2.js aptis/shared/writing-report-package-v4.js \
            aptis/shared/legacy-resume-v2.js aptis/shared/draft-version-store-v3.js aptis/shared/history-draft-versions-v3.js \
            aptis/shared/tab-lock-v1.js aptis/shared/active-resource-lock-v1.js aptis/shared/history-compare-v1.js
          do node --check "$file"; done
      - name: Validate Writing bank v2
        run: python tools/writing/validate_bank.py
      - name: Validate M6.3E Writing content release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bank=json.loads(Path('aptis/data/writing/bank-v2.json').read_text())
          manifest=json.loads(Path('aptis/data/writing/manifest-v2.json').read_text())
          registry=json.loads(Path('aptis/module-registry-v6.json').read_text())
          core=json.loads(Path('aptis/data/manifest.json').read_text())
          assert core['total_item_count']==2696 and core['reading_test_count']==24
          assert bank['release']['release_id']=='WR-2026.08-R2'
          assert bank['release']['status']=='PUBLISHED_FINAL'
          assert len(bank['tests'])==10 and sum(len(t['tasks']) for t in bank['tests'])==50
          assert len(bank['topics'])==10
          assert all(t['status']=='PUBLISHED_FINAL' and len(t.get('reviewed_by',[]))>=2 for t in bank['tests'])
          assert all(task['status']=='PUBLISHED_FINAL' and task.get('review_note') for t in bank['tests'] for task in t['tasks'])
          prompts=[]
          for test in bank['tests']:
              prompts += [task['prompt'].strip().lower() for task in test['tasks']]
          assert len(prompts)==len(set(prompts))
          assert manifest['test_count']==10 and manifest['task_count']==50 and manifest['topic_count']==10
          assert manifest['publishing']['final_release_ready'] is True
          assert manifest['publishing']['independent_external_review'] is False
          modules={item['id']:item for item in registry['modules']}
          assert modules['writing']['status']=='content_ready'
          assert modules['writing']['release_id']=='WR-2026.08-R2'
          assert modules['writing']['bank_counts']=={'tests':10,'tasks':50,'topics':10,'rubrics':1}
          assert Path('docs/aptis-v6/WRITING_M63E_REVIEW_REPORT.md').exists()
          print('Aptis M6.3E Writing content release checks OK')
          PY
