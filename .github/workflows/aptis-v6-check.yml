name: Aptis v6 checks

on:
  pull_request:
    paths:
      - aptis/**
      - docs/aptis-v6/**
      - .github/workflows/aptis-v6-check.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check aptis/app.js
          node --check aptis/runtime-v6-module.js
          node --check aptis/history-v5.js
          node --check aptis/question-id-v53.js
          node --check aptis/listening/listening-v6.js
          node --check aptis/listening/listening-player-v1.js
          node --check aptis/listening/listening-retry-v2.js
          node --check aptis/speaking/speaking-v6.js
          node --check aptis/writing/writing-v6.js
          node --check aptis/writing/writing-recovery-v2.js
          node --check aptis/shared/attempt-store-v6.js
          node --check aptis/shared/history-page-v6.js

      - name: Validate HTML application contract
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          required={"homeView","quizView","resultView","statsView","statsBtn","themeBtn","topicSelect","readingTestSelect","attemptCount","bestScore","lastScore","answeredTotal","exitBtn","submitBtn","progressText","timer","progressBar","blockHost","prevBtn","nextBtn","resultScore","resultPercent","resultMessage","grammarScore","vocabScore","readingScore","blankScore","reviewAllBtn","reviewBtn","retryCurrentBtn","downloadResultBtn","restartBtn","reviewSummary","reviewHost","overallSummary","sessionLabel","backHomeBtn","bankStatsGrid","sessionStatsGrid","retrySessionWrongBtn","exportSessionBtn","exportAllBtn","clearCacheBtn","clearAllBtn","modeStatsBody","readingCoverageText","readingCoverageBar","readingStatsBody","historyBody"}
          class P(HTMLParser):
              def __init__(self): super().__init__();self.ids=[]
              def handle_starttag(self,tag,attrs):
                  for k,v in attrs:
                      if k=="id" and v:self.ids.append(v)
          for f in ["aptis/core/index.html","aptis/reading/index.html"]:
              p=P();p.feed(Path(f).read_text());assert required.issubset(set(p.ids))
          for f in ["aptis/index.html","aptis/listening/index.html","aptis/speaking/index.html","aptis/writing/index.html","aptis/history/index.html"]: assert Path(f).exists()
          h=P();h.feed(Path("aptis/history/index.html").read_text());assert {"reviewDialog","reviewContent","storageSummary","importHistory"}.issubset(set(h.ids))
          print("HTML contracts OK")
          PY

      - name: Validate bank registry and contract v2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("aptis/data/manifest.json").read_text());reading=json.loads(Path("aptis/data/reading-manifest.json").read_text());registry=json.loads(Path("aptis/module-registry-v6.json").read_text());contract=json.loads(Path("aptis/contracts/attempt-contract-v2.json").read_text())
          assert manifest["grammar_count"]==1000 and manifest["vocabulary_count"]==1000 and manifest["reading_count"]==696 and manifest["total_item_count"]==2696 and manifest["reading_test_count"]==24
          assert reading["item_count"]==696 and reading["test_count"]==24
          modules={x["id"]:x for x in registry["modules"]};assert modules["core"]["status"]=="available" and modules["reading"]["status"]=="available" and modules["listening"]["status"]=="mvp" and modules["speaking"]["status"]=="mvp" and modules["writing"]["status"]=="mvp"
          assert contract["version"]=="2.0.0" and {"attempt","asset","draft"}.issubset(contract["definitions"])
          for f in ["aptis/listening/listening-retry-v2.js","aptis/writing/writing-recovery-v2.js"]: assert Path(f).exists()
          print("Aptis v6 M6.5B contract and recovery layers OK")
          PY
