name: Aptis v6 checks

on:
  pull_request:
    paths: ["aptis/**", "tools/writing/**", "tools/speaking/**", "docs/aptis-v6/**", ".github/workflows/aptis-v6-check.yml", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate M6.4E Speaking release
        run: python tools/speaking/build_m64e_release.py
      - name: Validate JavaScript syntax
        run: |
          for file in aptis/app.js aptis/runtime-v6-module.js aptis/history-v5.js aptis/question-id-v53.js aptis/listening/listening-v6.js aptis/listening/listening-player-v1.js aptis/listening/listening-retry-v2.js aptis/speaking/speaking-v6.js aptis/speaking/speaking-self-review-v1.js aptis/shared/media-recorder-service-v2.js aptis/writing/writing-v6.js aptis/writing/writing-recovery-v2.js aptis/writing/writing-self-review-v3.js aptis/shared/attempt-store-v6.js aptis/shared/history-page-v6.js aptis/shared/history-writing-review-v2.js aptis/shared/writing-report-package-v4.js aptis/shared/speaking-review-package-v5.js aptis/shared/legacy-resume-v2.js aptis/shared/draft-version-store-v3.js aptis/shared/history-draft-versions-v3.js aptis/shared/tab-lock-v1.js aptis/shared/active-resource-lock-v1.js aptis/shared/history-compare-v1.js; do node --check "$file"; done
      - name: Validate banks
        run: |
          python tools/writing/validate_bank.py
          python tools/speaking/validate_bank.py
      - name: Validate M6.4E content release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bank=json.loads(Path('aptis/data/speaking/bank-v2.json').read_text())
          manifest=json.loads(Path('aptis/data/speaking/manifest-v2.json').read_text())
          registry=json.loads(Path('aptis/module-registry-v6.json').read_text())
          assert len(bank['tests'])==5 and sum(len(t['tasks']) for t in bank['tests'])==50
          assert manifest['release_id']=='SPK-2026.08-R2' and manifest['final_release_ready'] if 'final_release_ready' in manifest else manifest['publishing']['final_release_ready']
          for test in bank['tests']:
              parts=[q['part'] for q in test['tasks']]
              assert parts.count(1)==3 and parts.count(2)==3 and parts.count(3)==3 and parts.count(4)==1
              assert all(q['response_seconds']==30 for q in test['tasks'] if q['part']==1)
              assert all(q['response_seconds']==45 for q in test['tasks'] if q['part'] in (2,3))
              p4=[q for q in test['tasks'] if q['part']==4][0]; assert p4['preparation_seconds']==60 and p4['response_seconds']==120
              assert test['reviewed_by'] and 'no official prompt or photograph copied' in test['source_note']
          assert len(bank['images'])>=10 and all(i['license']=='CC0-1.0' and i['checksum'].startswith('sha256:') for i in bank['images'])
          modules={m['id']:m for m in registry['modules']}; assert modules['speaking']['status']=='content_ready'
          print('M6.4E Speaking content release checks OK')
          PY
