name: Deploy ForLanguage GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - aptis/**
      - docs/**
      - .nojekyll
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forlanguage-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Aptis question bank
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("aptis/data")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          reading = json.loads((root / "reading-manifest.json").read_text(encoding="utf-8"))

          expected = {
              "grammar_count": 1000,
              "vocabulary_count": 1000,
              "reading_count": 696,
              "total_item_count": 2696,
              "reading_test_count": 24,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(
                      f"manifest validation failed: {key}={manifest.get(key)!r}, expected {value}"
                  )

          if reading.get("item_count") != 696 or reading.get("test_count") != 24:
              raise SystemExit("reading manifest validation failed")

          required = [
              "grammar.json", "vocabulary.json", "reading-tests.json",
              "reading-tasks.json", "reading-units.json", "reading-items.json",
              "concepts.json", "edges.json", "item_graph.json",
              "adaptive_rules.json", "learner_state.json",
          ]
          for name in required:
              path = root / name
              if not path.exists() or path.stat().st_size < 2:
                  raise SystemExit(f"missing or empty: {path}")

          required_pages = [
              Path("aptis/index.html"),
              Path("aptis/core/index.html"),
              Path("aptis/reading/index.html"),
              Path("aptis/runtime-v6-module.js"),
          ]
          for path in required_pages:
              if not path.exists() or path.stat().st_size < 20:
                  raise SystemExit(f"missing Aptis v6 page: {path}")

          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          touch .nojekyll
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
